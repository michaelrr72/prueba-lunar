<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Lunar | Modo Cooperativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/modes.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e15">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prueba Lunar">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
</head>

<body data-mode="coop">
  <div id="app-root" class="site-shell"></div>
  <noscript>Necesitas habilitar JavaScript para usar la Prueba Lunar.</noscript>
  <script src="assets/js/data.local.js" defer></script>
  <script src="assets/js/features/coop-mode.js" defer></script>
  <script>
    // Registro del Service Worker · activa funcionamiento offline e instalación PWA.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.warn('[PWA] Service Worker no registrado:', err);
        });
      });
    }
  </script>
</body>

</html>
