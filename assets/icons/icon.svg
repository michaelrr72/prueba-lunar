<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Prueba Lunar">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0c870"/>
      <stop offset="60%" stop-color="#d4a847"/>
      <stop offset="100%" stop-color="#a47a28"/>
    </radialGradient>
  </defs>
  <!-- Fondo con esquinas redondeadas (maskable-friendly) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Pequeñas estrellas decorativas -->
  <circle cx="120" cy="120" r="3" fill="#d4a847" opacity="0.7"/>
  <circle cx="400" cy="160" r="2.5" fill="#d4a847" opacity="0.5"/>
  <circle cx="380" cy="400" r="3" fill="#d4a847" opacity="0.6"/>
  <circle cx="110" cy="380" r="2" fill="#d4a847" opacity="0.5"/>
  <!-- Luna creciente: círculo dorado lleno + círculo oscuro encima para crear el creciente -->
  <circle cx="240" cy="256" r="150" fill="url(#moon)"/>
  <circle cx="295" cy="225" r="140" fill="url(#bg)"/>
</svg>
